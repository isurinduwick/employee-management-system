# The Flutter template asks for an 8G heap, which this machine cannot back
# (the JVM aborts with "paging file is too small"). These values fit the
# available memory; -Xss is raised because Gradle's output-forwarding thread
# overflows the default stack when relaying the flutter.bat build output.
org.gradle.jvmargs=-Xmx2g -Xss4m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Compile Kotlin inside the Gradle daemon instead of spawning a second JVM —
# one less process competing for memory on a constrained machine.
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
